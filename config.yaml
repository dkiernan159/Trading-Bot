# Bot configuration. Values here are my best-effort defaults based on the strategy
# as described -- review STRATEGY.md for the reasoning behind anything marked "ASSUMPTION".

instrument:
  symbol: MNQ
  tick_size: 0.25
  point_value: 2.0          # USD per index point per contract (MNQ multiplier)

session:
  timezone: America/New_York
  asia_session: ["19:00", "23:59"]    # ASSUMPTION: prior-evening ET window used to mark the Asia high/low
  london_session: ["02:00", "05:00"]  # ASSUMPTION: ET window used to mark the London high/low
  ny_open: "09:30"
  opening_range_end: "09:45"          # first 15m candle closes here -> box is formed
  no_new_entries_after: "13:30"       # ASSUMPTION: cutoff for taking any new setup (extended 2026-07-04, first
                                       # 11:30->12:30 for the two-stage 15m-anchor + fresh-retest design, then
                                       # 12:30->13:30: a real 30-day backtest's funnel showed anchors forming
                                       # fine (26 of 37 breakouts, 70%) but only 7 of those 26 (27%) ever
                                       # retraced back to their own midpoint before running out of session --
                                       # that's now the actual bottleneck for trade frequency, not anchor
                                       # strength, so cutoff is extended again to give already-formed anchors
                                       # more real time to retrace; see STRATEGY.md)
  flatten_by: "13:45"                  # ASSUMPTION: hard flatten time if still in a trade (extended with the
                                       # cutoff above)

strategy:
  reward_risk_ratio: 1.67   # Changed from 2.0 2026-07-31 alongside scaling contract_size 1->3 (your explicit
                             # instruction: "scale the TP up to $500 and the stop loss up to $300 as maximums
                             # for both"). 500/300 ~= 1.67 -- a max-sized real structural stop now produces a
                             # target close to $500 rather than $600 at the old 2:1 ratio. Target is still
                             # always exactly this multiple of whatever the real per-trade stop distance is
                             # (see risk.py's compute_stop_target) -- there's no independent target cap, so a
                             # tighter real stop still produces a proportionally smaller target, not a flat $500.
  target_dollars_at_reference_size: 300   # your usual $300 target
  reference_contracts: 5                  # ...at your usual 5-contract size
  max_stop_dollars: 300   # Raised from 200 2026-07-31 alongside contract_size 1->3, your explicit instruction.
                           # NOTE: this is a deliberate tightening in points, not a proportional 3x scale-up --
                           # at contract_size=1 this was 200/2.0/1=100pts; at contract_size=3 this is now
                           # 300/2.0/3=50pts, half the previous point-based cap, since you chose $300 (not the
                           # proportional $600) as the new maximum. Converted to points at signal time
                           # (max_stop_dollars / point_value / contract_size), so it stays this $ cap regardless
                           # of contract_size. The actual stop is placed at whichever real structural level
                           # (nearest strong 5m FVG, or break-of-structure swing point -- see
                           # find_structural_stop_price) is nearest beyond entry -- if that nearest level is
                           # farther away than this allows, or no such level exists beyond entry at all, the
                           # trade is skipped rather than defaulting to an arbitrary max-risk stop (changed
                           # 2026-07-04 after a real 7-day backtest showed both losing trades were exactly this
                           # case; see risk.py's compute_stop_target).
  min_stop_dollars: 120   # Raised from 40 2026-07-31 alongside contract_size 1->3, your explicit instruction --
                           # scaled 3x (unlike max_stop_dollars above) specifically to keep the same 20-point
                           # floor this was originally tuned against (40/2.0/1=20pts at contract_size=1;
                           # 120/2.0/3=20pts at contract_size=3). Skip the trade if the nearest real structural
                           # level is even closer than this (same conversion-to-points as max_stop_dollars) -- a
                           # real 7-day backtest showed trades whose stop landed under ~20 points away (usually
                           # the opening-range box edge, which is often just where the breakout happened, not a
                           # real invalidation point) won only 1 of 7 times, versus 3 of 6 among trades with a
                           # wider, more genuine stop. A stop that tight is inside ordinary MNQ chop, not a real
                           # structural level. Retune against real data like every other threshold here; see
                           # STRATEGY.md.
  entry_retracement_pct: 0.5   # how far price must retrace into the anchor 5m FVG before counting as filled, as
                                 # a fraction of the gap's own width -- 0.5 is the exact midpoint. Loosened to 0.35
                                 # 2026-07-04 to recover trades from the "superseded" near-miss bucket (by far the
                                 # largest, 29 of 51 in a real 30-day backtest); reverted back to 0.5 the same day
                                 # after a real --verbose run showed the 3 trades this recovered (2026-06-12 x2,
                                 # -29) all lost, dropping win rate from 50% to 33% and net from $249.75 to
                                 # $159.28 despite the extra trades. This is the *second* consecutive loosening
                                 # attempt (see min_stop_dollars's own history) where the specific trades a
                                 # loosened rule recovered were pure losers -- 0 of 8 combined across both --
                                 # a pattern, not noise: setups that only qualify once a rule is loosened seem to
                                 # be lower quality by exactly the measure that rule was checking. Still provably
                                 # safe from "mitigated before it could fill" for any value strictly between 0 and
                                 # 1 if this is revisited -- see strategy.py's _entry_price.
  fvg:                            # the 5m FVG: confirms direction/anchors the move -- its own midpoint is
                                   # also the entry price (see rule 4/5 in STRATEGY.md). Changed from 15m to
                                   # 5m timeframe 2026-07-04 based on a real annotated trade example: the
                                   # actual methodology has no separate 15-minute FVG at all -- "15 minute" in
                                   # "15 Minute Opening Range Breakout" refers only to the box, and the FVG
                                   # that anchors/enters the move forms on 5-minute candles (in the real
                                   # example, retested over an hour after it formed, well after price had
                                   # already rallied further away -- confirmed there's no time/distance limit
                                   # on the retest beyond the session cutoff). One of two alternative anchor
                                   # sources as of 2026-07-04 -- see entry_fvg below -- rather than the only gate
                                   # between a breakout and a trade.
    timeframe_minutes: 5
    min_gap_points: 1.5           # ASSUMPTION: minimum 5m FVG size to count as a valid gap -- retune from real
                                   # backtests; this now has to do double duty as both "confirms the move" and
                                   # "the entry structure," so it's set between the old 15m anchor threshold
                                   # (2.0) and the old (removed) nested-5m-entry threshold (0.4-1.0).
    displacement_multiplier: 1.0  # ASSUMPTION: "strong" = displacement candle body >= 1.0x recent avg range
    lookback_bars: 8              # 5m candles used for the recent average range baseline (~40 minutes)
  entry_fvg:                      # ASSUMPTION (added 2026-07-04): an alternative, 1-minute-timeframe anchor
                                   # source -- either this OR the 5m fvg above can anchor/enter a trade once the
                                   # ORB breakout direction is set, whichever qualifies (both detectors' pools
                                   # are searched together, nearest-to-price wins, same "kept live" behavior as
                                   # a single detector -- see strategy.py's _candidate_anchors). Added at your
                                   # explicit request: a real 7-day backtest was finding only 2 trades against a
                                   # hard requirement of >=1/trading day (7 in 7), and the funnel showed plenty
                                   # of 5m anchors forming (23) but few retracing all the way back to fill (3) --
                                   # a 1-minute-scale FVG inside the same confirmed move gives price many more,
                                   # much nearer opportunities to retrace into a real (if smaller-scale) gap.
                                   # NOTE: this reintroduces a 1-minute detector removed in the 5m-only redesign
                                   # above -- but as an *alternative* anchor source here, not the old nested
                                   # "small FVG inside the big one" double-confirmation design that was removed
                                   # for being the tightest bottleneck in the whole funnel. Genuinely untested
                                   # against real data: 1-minute-scale gaps are noisier than 5-minute ones by
                                   # nature, and every other loosening tried in this project so far (a wider
                                   # stop search, a shallower retracement) recovered trades that were pure
                                   # losers.
    timeframe_minutes: 1
    min_gap_points: 12             # Raised 2026-07-04 from the original 0.5 ASSUMPTION after a real 30-day
                                   # --verbose backtest (25 trades): every trade whose anchor gap was under 14
                                   # points lost (7 of 7, 0 wins), while trades with a gap >=14 points won 11 of
                                   # 18 (61%) -- a clean cutoff, not a soft correlation, and true regardless of
                                   # direction, stop distance, or which detector (one of the 7 tiny losers was
                                   # even a 5m anchor). Excluding just those 7 trades would have turned a 44%
                                   # win rate / $217 net window into 61% / $1,146.54 across the remaining 18,
                                   # while still leaving ~14 of 19 trading days with a trade. At min_gap_points
                                   # 0.5, "any displacement counts" -- a 3.5-6.75 point 1-minute gap on MNQ is
                                   # ordinary noise, not real structure; displacement_multiplier alone doesn't
                                   # catch this because in a quiet stretch the recent average range is also
                                   # small, so a tiny gap can look "relatively strong" while staying absolutely
                                   # tiny. Set to 12 (just below the observed 14-point minimum winning gap, to
                                   # avoid overfitting the exact boundary of a 25-trade sample) -- retune
                                   # against more real data.
    displacement_multiplier: 1.0  # ASSUMPTION: same ratio-based "strong" definition as the 5m detector.
    lookback_bars: 8              # 1m candles used for the recent average range baseline (~8 minutes)
  reentry:
    allow_reentry_after_stop: true      # per your answer: re-arm if stopped out and setup reforms
    allow_new_setup_after_win: true     # Flipped from false 2026-07-31 at your explicit instruction ("for
                                    # testing lets just remove the limit entirely") -- confirmed the bot
                                    # standing down after a single overnight win that same night was this
                                    # flag, not a trade-count cap (both max_trades_per_day and
                                    # max_trades_per_night were already null). Now keeps hunting for new
                                    # setups after a win, same as it already does after a loss
                                    # (allow_reentry_after_stop). max_daily_loss_dollars and kill_switch
                                    # remain the real safety net regardless of how many trades happen.

  breakeven:                       # Added 2026-08-20 at your explicit request -- once a trade looks like it's
                                    # heading for target, move the stop above breakeven so it can't swing back
                                    # down and hit the original stop. Applies to both day and overnight
                                    # strategies (shared, same as everything else in this strategy: section).
    enabled: true
    trigger_pct: 0.5                # ASSUMPTION, your explicit choice: move the stop once price has moved
                                    # halfway from entry to target. Untested -- watch real results and retune;
                                    # a lower value locks in breakeven sooner (less giveback on reversals) but
                                    # risks stopping out trades that would have gone on to hit full target.
    buffer_dollars: 20               # your explicit choice: small positive buffer beyond exact breakeven, same
                                    # $-to-points conversion as max_stop_dollars (buffer_dollars / point_value /
                                    # contract_size) -- so a breakeven stop-out is still a small real win after
                                    # the buffer, not a guaranteed net loss once commissions/fees are counted.

  overnight:                       # ASSUMPTION (added 2026-07-05): a second, parallel strategy for the
                                    # Asia (19:00-23:59 ET prior evening) / London (02:00-05:00 ET) hours,
                                    # per your explicit request to trade overnight while you sleep. Unlike
                                    # the 9:30 ORB strategy, there's no box/breakout here -- direction is
                                    # set directly by whichever pooled 5m/1m FVG forms first (see fvg /
                                    # entry_fvg above), exactly the same detection-and-entry logic the day
                                    # strategy uses once its own box/breakout gate has passed. Same 2:1
                                    # reward:risk and the same $40-$200 stop band too (strategy.
                                    # max_stop_dollars / min_stop_dollars above) -- this strategy has no
                                    # config section of its own for FVG thresholds; it reuses fvg/entry_fvg
                                    # directly (see src/overnight_strategy.py), on your explicit instruction
                                    # to use "the same strategy for finding strong FVGs as the 15 minute ORB
                                    # strat, just without the ORB confluence layer".
                                    #
                                    # Revision history: originally built 2026-07-05 as a two-stage
                                    # large-anchor (15m/30m) + nested-entry (5m/1m) design, resurrecting an
                                    # even older nested-FVG design this project had already tried and
                                    # removed once (see git history, commits 94270f2..d1e1bd4, removed for
                                    # being the tightest bottleneck in the *day* funnel). A real 30-day
                                    # backtest of that two-stage version showed exactly the same failure
                                    # shape again: 110 anchors formed but only 8 ever got a nested entry
                                    # (funnel bottleneck), and the 4 that did fill went 0-4. Replaced the
                                    # same day with this single-stage design instead -- per your direct
                                    # instruction -- since it's proven against real NY-session data already.
                                    # Still genuinely untested against real Asia/London data itself (the
                                    # volatility/gap profile outside NY hours may not match), so retune
                                    # fvg/entry_fvg specifically for this window once more real data comes
                                    # in, rather than assuming the NY-tuned values transfer directly.
                                    #
                                    # WENT LIVE 2026-07-07: at your explicit instruction ("I want the
                                    # overnight piece to go live now... this account is a combine so it
                                    # isn't real money -- this a perfect live testing ground" / "I want to
                                    # constantly iterate as we trade"), wired into src/runner.py alongside
                                    # the day strategy (see Runner._StrategySlot -- each strategy manages
                                    # its own in-flight trade independently; risk_limits below is a single
                                    # shared account-wide cap across both, since they trade the same
                                    # account and budget). Enabled here is no longer backtest-CLI-only --
                                    # it now gates the live overnight slot too. Expect this to keep changing
                                    # as real overnight trades come in; retune fvg/entry_fvg/max_trades_per_night
                                    # against real results the same way every other threshold in this file
                                    # has been tuned.
    enabled: true                  # gates BOTH src/backtest.py's --overnight mode AND the live overnight
                                    # slot in src/runner.py (see above)
    max_trades_per_night: null      # removed 2026-07-16 at your explicit instruction ("the per-day limit
                                    # on trades is a bad idea given we're just testing, remove the limit
                                    # entirely") -- null means no cap on trades-per-night.
                                    # History: raised 2026-07-07 from 2 to 4 when going live ("capped at 4
                                    # trades per night with the same risk tolerance"), untested at that
                                    # value -- the only real backtest evidence (single-stage design, no cap:
                                    # 38 trades, 37% WR, +$291.25 net) showed nights with 2+ trades
                                    # performing far worse (29% WR) than single-trade nights (67% WR); a cap
                                    # of 2 was chosen and tested for exactly that reason originally. Flagged
                                    # again before this removal for the same reason -- watch real results
                                    # closely, since this is the second time this exact cap has been loosened
                                    # against that evidence. max_daily_loss_dollars and kill_switch below
                                    # remain the real safety net regardless of trade count either way.
                                    # Same $120-$300 stop band / 1.67:1 R:R as the day strategy either way
                                    # ("same risk tolerance" -- strategy.max_stop_dollars/min_stop_dollars/
                                    # reward_risk_ratio above, unchanged, shared with the day strategy).

position_sizing:
  contract_size: 3        # Raised from 1 2026-07-31 at your explicit instruction ("I'm happy with the
                           # testing so far... let's move from one micro contract to 3 micro contracts per
                           # trade") -- done alongside raising max_stop_dollars/min_stop_dollars/
                           # reward_risk_ratio above so the same real structural stops still qualify at
                           # roughly 3x the dollar risk/reward, not just a smaller allowed point-range at the
                           # same total dollar size. Flagged before this change: the since-the-customTag-fix
                           # sample (dashboard.py's BRACKET_ID_FIX_DEPLOYED_AT slice) was 16 of the 25-trade
                           # target, 37.5% WR, net -$98 -- i.e. running at a loss, not the proven win rate the
                           # comment below originally expected before scaling. You chose to proceed anyway.
  scaling: manual_only     # you bump this yourself once win rate is proven -- see the contract_size note above

risk_limits:
  max_trades_per_day: null       # removed 2026-07-14 at your explicit instruction (was 4) -- no cap on trade
                                   # count; max_daily_loss_dollars and kill_switch below are the real safety net
  max_daily_loss_dollars: 600    # ASSUMPTION: hard stop for the day, protects a funded/eval account
  kill_switch: false              # set true to force the bot to flatten and stop taking new trades

broker:
  provider: projectx_gateway
  base_url: https://api.topstepx.com
  realtime_base_url: https://rtc.topstepx.com
  # Flipped to false 2026-07-05 with explicit user go-ahead, to place real
  # orders on their TopstepX combine (evaluation) account -- see the
  # module docstring in src/broker/projectx_gateway.py for what's still
  # unverified against the live API (watch the terminal's [LIVE] lines on
  # first run) and STRATEGY.md's "Before going live" section.
  dry_run: false

dashboard:
  # Binds to localhost only -- view it via an SSH local port-forward
  # (see DEPLOY.md), never expose this port publicly.
  host: 127.0.0.1
  port: 8080
  # How often the backtest section re-fetches from the real API and
  # rebuilds its charts. Live trades (from trades/trades.csv) are free to
  # read and always served fresh on every request -- only the backtest
  # section is throttled, since it costs real API calls.
  refresh_interval_seconds: 1800  # 30 minutes
  backtest_days: 30  # widened from 7 2026-07-05 -- a 7-day window has repeatedly shown as few as 2-6 trades
                      # throughout this project's tuning (sometimes all wins by chance), which read as "the
                      # dashboard is hiding losses" but was really just a small, currently-lucky sample. 30
                      # days matches the window most of this project's real backtests were tuned against.
                      # NOTE: fetch_recent_bars makes one /History/retrieveBars call per calendar day in this
                      # window (32 requests at 30 days, incl. the 2-day buffer) -- this real widening tripped
                      # TopstepX's rate limit (429) the same day, fixed via retry-with-backoff in
                      # ProjectXGatewayBroker._post plus a small proactive delay between requests.
