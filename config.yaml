# Bot configuration. Values here are my best-effort defaults based on the strategy
# as described -- review STRATEGY.md for the reasoning behind anything marked "ASSUMPTION".

instrument:
  symbol: MNQ
  tick_size: 0.25
  point_value: 2.0          # USD per index point per contract (MNQ multiplier)

session:
  timezone: America/New_York
  asia_session: ["19:00", "23:59"]    # ASSUMPTION: prior-evening ET window used to mark the Asia high/low
  london_session: ["02:00", "05:00"]  # ASSUMPTION: ET window used to mark the London high/low
  ny_open: "09:30"
  opening_range_end: "09:45"          # first 15m candle closes here -> box is formed
  no_new_entries_after: "11:30"       # ASSUMPTION: cutoff for taking any new setup
  flatten_by: "11:45"                 # ASSUMPTION: hard flatten time if still in a trade

strategy:
  reward_risk_ratio: 2.0
  target_dollars_at_reference_size: 300   # your usual $300 target
  reference_contracts: 5                  # ...at your usual 5-contract size
  max_stop_dollars: 200   # hard dollar cap on stop-loss risk per trade, at position_sizing.contract_size.
                           # Converted to points at signal time (max_stop_dollars / point_value / contract_size),
                           # so it stays a $200 cap even as contract_size is manually scaled up. The actual stop
                           # is placed at whichever marked structural level (previous day/Asia/London high-low,
                           # box edge, or the 15m anchor FVG's far boundary) is nearest beyond entry -- this cap
                           # only kicks in if that nearest level is farther away than $200 allows.
  fvg:                            # the "large" 15m FVG: confirms direction, anchors where to look for an entry
    timeframe_minutes: 15
    min_gap_points: 2.5           # ASSUMPTION: minimum 15m FVG size to count as a valid gap (loosened 2026-07-04
                                   # from 3.0 -- too few anchors were forming; see STRATEGY.md)
    displacement_multiplier: 1.3  # ASSUMPTION: "strong" = displacement candle body >= 1.3x recent avg range
                                   # (loosened 2026-07-04 from 1.5)
    lookback_bars: 8              # 15m candles used for the recent average range baseline (~2 hours)
  entry_fvg:                      # the 1m FVG nested inside the 15m FVG -- the actual entry trigger, kept
                                   # small/tight so the stop isn't sized off 15m-candle noise
    timeframe_minutes: 1
    min_gap_points: 0.5           # ASSUMPTION: minimum 1m FVG size (loosened 2026-07-04 from 0.75 -- since the
                                   # nested FVG now also has to form *after* the anchor locks in, requiring it
                                   # to also be large was leaving too narrow a window to find one; see STRATEGY.md)
    displacement_multiplier: 1.2  # ASSUMPTION: "strong" = displacement candle body >= 1.2x recent avg range
                                   # (loosened 2026-07-04 from 1.5, same reasoning)
    lookback_bars: 20             # 1m candles used for the recent average range baseline (~20 minutes)
  reentry:
    allow_reentry_after_stop: true      # per your answer: re-arm if stopped out and setup reforms
    allow_new_setup_after_win: false    # ASSUMPTION: stand down for the day after a winner (change if wrong)

position_sizing:
  contract_size: 1        # START SMALL per your instructions. Bot never changes this itself.
  scaling: manual_only     # you bump this to 5 yourself once win rate is proven

risk_limits:
  max_trades_per_day: 4          # ASSUMPTION: safety cap, independent of setup re-entry logic
  max_daily_loss_dollars: 600    # ASSUMPTION: hard stop for the day, protects a funded/eval account
  kill_switch: false              # set true to force the bot to flatten and stop taking new trades

broker:
  provider: projectx_gateway
  base_url: https://api.topstepx.com
  realtime_base_url: https://rtc.topstepx.com
  # SAFETY: keep this true until you've verified order placement against a
  # paper/sim account -- see the module docstring in
  # src/broker/projectx_gateway.py for exactly what's unverified.
  dry_run: true

dashboard:
  # Binds to localhost only -- view it via an SSH local port-forward
  # (see DEPLOY.md), never expose this port publicly.
  host: 127.0.0.1
  port: 8080
  # How often the backtest section re-fetches from the real API and
  # rebuilds its charts. Live trades (from trades/trades.csv) are free to
  # read and always served fresh on every request -- only the backtest
  # section is throttled, since it costs real API calls.
  refresh_interval_seconds: 1800  # 30 minutes
  backtest_days: 7
